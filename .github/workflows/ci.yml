name: CI

# PR の検証（docs/environment-setup.md のコマンドと同じ）。公開・デプロイは行わない。
# 画面比較（screens）はローカル専用の参照PNG（Git対象外）が必要なため CI では実行しない。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # 共通マスターを固定した出典（commit・SHA-256）から生成し、網羅性を検証する
      - run: npm run master:build
      - run: npm run master:crosscheck
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
